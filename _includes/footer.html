<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author }} &middot; {{ site.title }}</p>
    <p class="footer-links">
      <a href="{{ '/feed.xml' | relative_url }}">{% include icon.html name='rss' %} RSS</a>
      <a href="https://github.com/{{ site.github_username }}">{% include icon.html name='github' %} GitHub</a>
    </p>
  </div>
</footer>
<div class="search" hidden role="dialog" aria-modal="true" aria-label="Search posts">
  <div class="search-panel">
    <div class="search-field">{% include icon.html name='search' %}<input type="search" placeholder="Search posts, tags, errors…" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <ol class="search-results" data-index="{{ '/search.json' | relative_url }}"></ol>
  </div>
</div>
