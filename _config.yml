# Site name is a placeholder until Andrew picks one. Change it here only;
# every page reads site.title.
title: Andrew's Notes
tagline: Notes from the workbench
description: >-
  Interesting finds and troubleshooting write-ups from my projects: home
  automation, networking, CNC and whatever else I'm tinkering with.
author: Andrew
url: "https://andrewpc.github.io"
baseurl: ""
github_username: andrewpc

permalink: /:year/:month/:day/:title/
timezone: Australia/Sydney

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Comments on posts, via giscus (https://giscus.app), stored as GitHub
# Discussions on this repo. The comment box only renders once category_id is
# set. Get repo_id/category_id from giscus.app after enabling Discussions and
# installing the giscus app. Set `comments: false` on a post to hide it there.
giscus:
  repo: andrewpc/andrewpc.github.io
  repo_id: R_kgDOV3HvYA
  category: Announcements
  category_id: DIC_kwDOV3HvYM4DLtVV

# Top navigation (the theme lives in _layouts, _includes and assets/).
nav:
  - title: Posts
    url: /
  - title: Tags
    url: /tags/
  - title: Archive
    url: /archive/
  - title: About
    url: /about/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - CLAUDE.md
  - CONTRIBUTING.md
  - README.md
  - _templates/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
