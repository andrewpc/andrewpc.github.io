title: Andrew's Notes
description: >-
  Interesting finds and troubleshooting write-ups from my projects.
author: Andrew
url: "https://andrewpc.github.io"
baseurl: ""
github_username: andrewpc

theme: minima
permalink: /:year/:month/:day/:title/
timezone: Australia/Sydney

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

show_excerpts: true

minima:
  social_links:
    github: andrewpc

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - CLAUDE.md
  - CONTRIBUTING.md
  - README.md
  - _templates/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
